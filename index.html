<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Add-in Word Sederhana</title>
    <!-- Memuat Office JavaScript API dari CDN resmi Microsoft -->
    <script src="https://microsoft.com" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            margin: 0;
            background-color: #f3f2f1;
        }
        h2 { color: #2b579a; }
        p { font-size: 14px; color: #333; }
        .btn {
            background-color: #2b579a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }
        .btn:hover { background-color: #1e3d6b; }
    </style>
</head>
<body>
    <h2>Add-in Internal Perusahaan</h2>
    <p>Klik tombol di bawah ini untuk memasukkan teks template secara otomatis ke dalam dokumen Word Anda.</p>
    <button id="insert-text-btn" class="btn">Masukkan Teks</button>

    <!-- Memuat file logika JavaScript -->
    <script src="taskpane.js" type="text/javascript"></script>
</body>
</html>
